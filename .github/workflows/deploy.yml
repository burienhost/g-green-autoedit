name: Deploy G-Green AutoEdit to Afrihost

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: g-green-autoedit-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out application
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          test -n "$FTP_SERVER" || { echo "Missing FTP_SERVER secret"; exit 1; }
          test -n "$FTP_USERNAME" || { echo "Missing FTP_USERNAME secret"; exit 1; }
          test -n "$FTP_PASSWORD" || { echo "Missing FTP_PASSWORD secret"; exit 1; }

      - name: Deploy application files only
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          # FTP user is already jailed to /home/ggreebnx/edit.g-green.co.za/.
          # Deploying into a named subdirectory creates an unwanted nested site.
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            engine/**
            **/README*
            **/*.md
            **/*.yml
            **/*.yaml
            **/*.zip
            **/.htaccess
            **/.htaccess.*
            **/php.ini
            **/.user.ini
