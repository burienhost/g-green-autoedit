name: Deploy G-Green AutoEdit to Afrihost

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out application
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_TARGET_DIR: ${{ vars.FTP_TARGET_DIR }}
        run: |
          test -n "$FTP_SERVER" || { echo "Missing FTP_SERVER secret"; exit 1; }
          test -n "$FTP_USERNAME" || { echo "Missing FTP_USERNAME secret"; exit 1; }
          test -n "$FTP_PASSWORD" || { echo "Missing FTP_PASSWORD secret"; exit 1; }
          test -n "$FTP_TARGET_DIR" || { echo "Missing FTP_TARGET_DIR variable"; exit 1; }
          case "$FTP_TARGET_DIR" in
            */edit.g-green.co.za/|edit.g-green.co.za/) ;;
            *) echo "FTP_TARGET_DIR must end in edit.g-green.co.za/"; exit 1 ;;
          esac

      - name: Deploy application files only
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: ${{ vars.FTP_TARGET_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/README*
            **/*.md
            **/*.yml
            **/*.yaml
            **/*.zip
            **/.htaccess
            **/.htaccess.*
            **/php.ini
            **/.user.ini
