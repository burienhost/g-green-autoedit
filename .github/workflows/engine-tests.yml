name: AutoEdit Pro v2 engine checks
on:
  push:
    branches:
      - feature/autoedit-pro-v2-integrated
    paths:
      - 'engine/**'
      - '.github/workflows/engine-tests.yml'
  pull_request:
    paths:
      - 'engine/**'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local engine dependencies
        run: python -m pip install -r engine/requirements.txt
      - name: Compile Python source
        run: python -m compileall -q engine
      - name: Run integrated synthetic tests
        run: python -m unittest discover -s engine/tests -v
