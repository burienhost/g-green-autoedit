name: SNAPIC Playwright browser evidence
on:
  push:
    branches:
      - development/snapic-culling-phase1
    paths:
      - 'index.html'
      - 'src/**'
      - 'browser-tests/**'
      - 'playwright.config.mjs'
      - '.github/workflows/snapic-playwright.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.56.1
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run deterministic unit tests
        run: node --test tests/*.test.mjs
      - name: Run browser interaction tests
        run: npx playwright test --config=playwright.config.mjs
      - name: Upload browser evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapic-browser-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
